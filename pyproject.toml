[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "papertrail-ai"
version = "0.1.0"
description = "Autonomous Document Intelligence, Forensic Fraud Detection, Compliance Risk & Cryptographic Audit Platform"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "PaperTrail AI Team" }
]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-q"
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
markers = [
    "integration: marks tests as cloud integration tests requiring live GCP credentials",
    "azure: marks tests as Azure infrastructure tests",
    "parity: marks cross-cloud deterministic parity tests",
    "e2e: marks end-to-end pipeline tests"
]
